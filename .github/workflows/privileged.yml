name: privileged

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  privileged:
    name: privileged lane (self-hosted kvm runner)
    # Only run PR builds when the 'privileged' label is present; manual
    # dispatch always runs.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'privileged')
    runs-on: [self-hosted, linux, x86_64, kvm]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install Nix
        uses: cachix/install-nix-action@v31

      - name: configure Cachix
        uses: cachix/cachix-action@v16

      - name: install devenv
        run: nix profile add nixpkgs#devenv

      - name: build release binaries
        run: devenv shell -- cargo build --release -p microvm-daemon -p microvm-cli

      - name: build guest image
        run: devenv shell -- bash scripts/build-guest-image.sh

      - name: real Firecracker e2e
        run: devenv shell -- bash scripts/e2e-firecracker.sh

      - name: privileged suite
        run: devenv shell -- bash scripts/run-privileged-suite.sh

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privileged-logs
          path: .work/logs/
          if-no-files-found: warn
