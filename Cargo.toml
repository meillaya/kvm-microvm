[workspace]
resolver = "2"
members = [
    "crates/microvm-types",
    "crates/microvm-errors",
    "crates/microvm-lifecycle",
    "crates/microvm-transport-contract",
    "crates/microvm-artifacts",
    "crates/microvm-oci",
    "crates/microvm-isolation",
    "crates/microvm-firecracker",
    "crates/microvm-service",
    "crates/microvm-rest",
    "crates/microvm-grpc",
    "crates/microvm-snapshots",
    "crates/microvm-metrics",
    "crates/microvm-scheduler",
    "crates/microvm-contract-tests",
    "crates/microvm-cli",
    "crates/microvm-bench",
    "crates/microvm-demo",
    "crates/microvm-backend-directkvm",
    "crates/microvm-security-tests",
    "crates/microvm-guest-health",
    "crates/microvm-e2e-tests",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.11"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
sha2 = "0.10"
libc = "0.2"
tempfile = "3"

[profile.release]

[profile.dev]
opt-level = 0
