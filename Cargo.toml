[workspace]
resolver = "2"
members = [
    "crates/microvm-types",
    "crates/microvm-errors",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.11"

[profile.release]

[profile.dev]
opt-level = 0
