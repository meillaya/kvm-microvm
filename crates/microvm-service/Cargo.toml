[package]
name = "microvm-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Privileged tests drive a real Firecracker/jailer through the composed
# [`VmLifecycleService`] on a capable host (KVM, cgroup-v2, TAP/netns). They are
# excluded from the default (deterministic) test run so CI can run without root,
# /dev/kvm, or a pinned binary. Enabling this feature enables the privileged
# lanes of the runtime and isolation crates it composes.
privileged = ["microvm-firecracker/privileged", "microvm-isolation/privileged"]

[dependencies]
microvm-types = { path = "../microvm-types" }
microvm-errors = { path = "../microvm-errors" }
microvm-lifecycle = { path = "../microvm-lifecycle" }
microvm-firecracker = { path = "../microvm-firecracker" }
microvm-isolation = { path = "../microvm-isolation" }
serde = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
microvm-artifacts = { path = "../microvm-artifacts" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
