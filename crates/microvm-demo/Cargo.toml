[package]
name = "microvm-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Warm HTTP-function microVM demo with cold first-call vs warm pool/request evidence (never a pass/fail gate)"

[[bin]]
name = "microvm-demo"
path = "src/main.rs"

[dependencies]
microvm-errors = { path = "../microvm-errors" }
microvm-artifacts = { path = "../microvm-artifacts" }
microvm-metrics = { path = "../microvm-metrics" }
microvm-bench = { path = "../microvm-bench" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
# Reserved for a future privileged Firecracker-backed restore lane. The demo's
# deterministic core (handler, pool, measurement, snapshot/restore protocol,
# blocked-lane handling) always compiles and runs without /dev/kvm; the in-process
# restorer models the warm-function protocol locally so `cargo test -p microvm-demo`
# is deterministic on any host.
privileged = []
