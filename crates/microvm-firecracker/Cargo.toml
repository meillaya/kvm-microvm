[package]
name = "microvm-firecracker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Privileged tests drive a real Firecracker/jailer on a capable host (KVM,
# cgroup-v2, TAP/netns). They are excluded from the default (deterministic)
# test run so CI can run without root, /dev/kvm, or a pinned binary.
privileged = []

[dependencies]
microvm-types = { path = "../microvm-types" }
microvm-errors = { path = "../microvm-errors" }
microvm-lifecycle = { path = "../microvm-lifecycle" }
microvm-metrics = { path = "../microvm-metrics" }
microvm-artifacts = { path = "../microvm-artifacts" }
microvm-isolation = { path = "../microvm-isolation" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = [
    "net",
    "io-util",
    "time",
    "sync",
    "process",
    "fs",
    "rt-multi-thread",
] }

[dev-dependencies]
tempfile = { workspace = true }
